<script>
/* ============================================================
   QUESTION BANK (60 QUESTIONS)
   ============================================================ */
const allQuestions = [
  // --- SET 1: Network Fundamentals & Models (ITN) ---
  { type: 'mcq', q: 'At which layer of the OSI model does a router operate?', options: {A: 'Layer 1', B: 'Layer 2', C: 'Layer 3', D: 'Layer 4'}, ans: 'C', exp: 'Routers use IP addresses to route packets, which operates at Layer 3 (Network).' },
  { type: 'mcq', q: 'Which model has 4 layers: Application, Transport, Internet, and Network Access?', options: {A: 'OSI Model', B: 'TCP/IP Model', C: 'MAC Model', D: 'VLAN Model'}, ans: 'B', exp: 'The TCP/IP model combines the top 3 OSI layers into Application and the bottom 2 into Network Access.' },
  { type: 'tf', q: 'A switch breaks up collision domains, but it DOES NOT break up broadcast domains by default.', options: {A: 'True', B: 'False'}, ans: 'A', exp: 'Every switch port is its own collision domain. However, switches forward broadcasts out all ports unless VLANs are configured.' },
  { type: 'mcq', q: 'What is the PDU (Protocol Data Unit) of the Transport layer?', options: {A: 'Packet', B: 'Frame', C: 'Segment', D: 'Bits'}, ans: 'C', exp: 'Transport layer PDUs are segments (TCP) or datagrams (UDP). Network = Packet, Data Link = Frame, Physical = Bits.' },
  { type: 'mcq', q: 'Which layer of the OSI model is responsible for logical addressing (IP addresses)?', options: {A: 'Layer 2', B: 'Layer 3', C: 'Layer 4', D: 'Layer 7'}, ans: 'B', exp: 'Layer 3 (Network Layer) handles logical addressing and routing.' },
  { type: 'short', q: 'What is the default port number for HTTPS?', ans: ['443'], exp: 'HTTP uses port 80. HTTPS uses port 443.' },
  { type: 'mcq', q: 'Which device is used to connect devices within the same LAN?', options: {A: 'Router', B: 'Switch', C: 'Modem', D: 'Firewall'}, ans: 'B', exp: 'Switches connect devices inside a Local Area Network (LAN). Routers connect different networks.' },
  { type: 'tf', q: 'The OSI model is a practical model used on the internet today, while TCP/IP is a theoretical reference model.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. OSI is the theoretical reference model. TCP/IP is the practical model used on the internet.' },
  { type: 'mcq', q: 'What type of address does a switch use to make forwarding decisions?', options: {A: 'IP Address', B: 'MAC Address', C: 'Port Number', D: 'Subnet Mask'}, ans: 'B', exp: 'Switches are Layer 2 devices and use MAC addresses to forward frames.' },
  { type: 'short', q: 'What does DNS stand for?', ans: ['domain name system'], exp: 'Domain Name System translates domain names (www.google.com) to IP addresses.' },

  // --- SET 2: IPv4 Subnetting & Addressing (ITN) ---
  { type: 'mcq', q: 'What is the broadcast address for the subnet 192.168.1.64/26?', options: {A: '192.168.1.127', B: '192.168.1.128', C: '192.168.1.63', D: '192.168.1.126'}, ans: 'A', exp: '/26 block size is 64. Subnet is .64 to .127. Broadcast is always the last address (.127).' },
  { type: 'mcq', q: 'How many usable hosts are in a /29 subnet?', options: {A: '6', B: '14', C: '30', D: '2'}, ans: 'A', exp: '/29 leaves 3 host bits. 2^3 = 8. Subtract 2 (network & broadcast) = 6 usable hosts.' },
  { type: 'short', q: 'What is the default subnet mask for a Class B network? (Write in dotted decimal)', ans: ['255.255.0.0', '/16'], exp: 'Class A = /8, Class B = /16 (255.255.0.0), Class C = /24.' },
  { type: 'mcq', q: 'Which of the following is a Private IP address?', options: {A: '8.8.8.8', B: '192.168.1.50', C: '169.254.10.5', D: '224.0.0.9'}, ans: 'B', exp: '192.168.x.x is private. 8.8.8.8 is public. 169.254.x.x is APIPA. 224.x.x.x is multicast.' },
  { type: 'mcq', q: 'A PC has the IP 169.254.10.5. What does this indicate?', options: {A: 'It has a public IP', B: 'It cannot reach a DHCP server', C: 'It is a loopback address', D: 'It has a static IP'}, ans: 'B', exp: '169.254.x.x is APIPA. The PC tried to get an IP via DHCP, failed, and assigned this to itself.' },
  { type: 'short', q: 'What is the IPv4 loopback address?', ans: ['127.0.0.1'], exp: '127.0.0.1 is used to test the local TCP/IP stack.' },
  { type: 'mcq', q: 'Given 10.0.0.0/24, you need to divide it into 4 equal subnets. What is the new subnet mask?', options: {A: '255.255.255.128', B: '255.255.255.192', C: '255.255.255.224', D: '255.255.255.240'}, ans: 'B', exp: '4 subnets = 2^2, so borrow 2 bits. /24 + 2 = /26. /26 is 255.255.255.192.' },
  { type: 'tf', q: 'A router uses the subnet mask to perform the ANDing process and determine the network address.', options: {A: 'True', B: 'False'}, ans: 'A', exp: 'True. The router ANDs the destination IP with the subnet mask to find the network address.' },
  { type: 'mcq', q: 'Which subnet mask provides exactly 2 usable hosts?', options: {A: '/30', B: '/31', C: '/29', D: '/28'}, ans: 'A', exp: '/30 leaves 2 host bits (4 total - 2 = 2 usable). Perfect for point-to-point links.' },
  { type: 'short', q: 'What is the first usable host address in the subnet 192.168.1.128/25?', ans: ['192.168.1.129'], exp: 'Network is .128. First host is always Network + 1 (.129).' },

  // --- SET 3: IPv6 & MAC (ITN & SRWE Mod 1) ---
  { type: 'mcq', q: 'What is the IPv6 loopback address?', options: {A: '::1', B: 'FE80::1', C: 'FF02::1', D: '::'}, ans: 'A', exp: '::1 is the IPv6 loopback. :: is the unspecified address. FE80 is link-local. FF02 is multicast.' },
  { type: 'mcq', q: 'Which IPv6 address type is automatically generated by a device and is only valid on a single link?', options: {A: 'Global Unicast', B: 'Link-Local', C: 'Multicast', D: 'Anycast'}, ans: 'B', exp: 'Link-Local addresses (FE80::/10) are automatically generated and used for communication on the local link only.' },
  { type: 'short', q: 'Compress this IPv6 address: 2001:0DB8:0000:0000:0000:0000:1428:57AB', ans: ['2001:db8::1428:57ab', '2001:0db8::1428:57ab'], exp: 'Remove leading zeros and replace the contiguous zero blocks with "::" -> 2001:DB8::1428:57AB.' },
  { type: 'mcq', q: 'In the EUI-64 process, what is inserted into the middle of the MAC address?', options: {A: 'FF:FF', B: 'FF:FE', C: '00:00', D: 'FE:FF'}, ans: 'B', exp: 'FF:FE is inserted exactly in the middle of the 48-bit MAC address.' },
  { type: 'mcq', q: 'During EUI-64, which bit of the first octet is flipped?', options: {A: 'The 1st bit', B: 'The 7th bit', C: 'The 8th bit', D: 'The last bit'}, ans: 'B', exp: 'The 7th bit (Universal/Local bit) is flipped (0 becomes 1, 1 becomes 0).' },
  { type: 'short', q: 'What portion of the MAC address is the OUI (Organizationally Unique Identifier)?', ans: ['first 3 bytes', 'first 24 bits', 'first half', 'first 3'], exp: 'The OUI is the first 24 bits (3 bytes) assigned by the IEEE to the vendor.' },
  { type: 'tf', q: 'SLAAC requires a DHCPv6 server to assign IPv6 addresses to hosts.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. SLAAC is "Stateless". Hosts generate their own IPs using the Router Advertisement (RA) prefix and EUI-64, no server needed.' },
  { type: 'mcq', q: 'What is the purpose of Duplicate Address Detection (DAD) in IPv6?', options: {A: 'To find the default gateway', B: 'To ensure the generated IP is unique on the network', C: 'To translate IPv6 to IPv4', D: 'To encrypt the IPv6 address'}, ans: 'B', exp: 'DAD ensures no other device on the link is using the same IPv6 address before the host assigns it.' },
  { type: 'short', q: 'What is the MAC address of a broadcast frame? (Use colons)', ans: ['ff:ff:ff:ff:ff:ff', 'ffff.ffff.ffff'], exp: 'A broadcast MAC address is all Fs: FF:FF:FF:FF:FF:FF.' },
  { type: 'mcq', q: 'If a router interface is 2001:DB8:ACAD:1::1/64, what is the network prefix?', options: {A: '2001:DB8:ACAD', B: '2001:DB8:ACAD:1', C: '2001:DB8:ACAD:1::', D: '2001:DB8'}, ans: 'B', exp: '/64 means the first 4 hextets (64 bits) are the network prefix.' },

  // --- SET 4: SRWE Modules 1-2 (Switching Concepts) ---
  { type: 'mcq', q: 'What happens when a switch receives a frame with an unknown destination MAC address?', options: {A: 'It drops the frame', B: 'It sends it back to the sender', C: 'It floods it out all ports except the ingress port', D: 'It sends an ARP request'}, ans: 'C', exp: 'Unknown unicast frames are flooded out all ports except the one they arrived on.' },
  { type: 'mcq', q: 'Which switching method has the lowest latency?', options: {A: 'Store-and-forward', B: 'Cut-through', C: 'Fragment-free', D: 'Fast-forward'}, ans: 'B', exp: 'Cut-through switches read only the destination MAC (first 6 bytes) and start forwarding immediately, minimizing latency.' },
  { type: 'tf', q: 'A switch learns MAC addresses by looking at the Destination MAC of incoming frames.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. A switch learns MAC addresses by looking at the SOURCE MAC of incoming frames.' },
  { type: 'short', q: 'What is the minimum size of an Ethernet frame (in bytes)?', ans: ['64', '64 bytes'], exp: 'The minimum is 64 bytes. Frames smaller than this are called runts and are discarded.' },
  { type: 'mcq', q: 'Why is padding added to an Ethernet frame?', options: {A: 'To encrypt the data', B: 'To ensure the frame meets the 64-byte minimum size', C: 'To add the MAC address', D: 'To check for errors'}, ans: 'B', exp: 'If the payload is less than 46 bytes, padding bytes are added so the total frame size is at least 64 bytes.' },
  { type: 'mcq', q: 'Which MAC address table entry will age out first if no traffic is received?', options: {A: 'A static entry', B: 'A dynamic entry', C: 'A sticky entry', D: 'A multicast entry'}, ans: 'B', exp: 'Dynamic entries age out after 300 seconds (5 mins) by default. Static/Sticky entries do not age out.' },
  { type: 'mcq', q: 'What happens to a runt frame when a switch receives it?', options: {A: 'It forwards it', B: 'It pads it', C: 'It discards it', D: 'It sends it to the router'}, ans: 'C', exp: 'Runt frames (smaller than 64 bytes) are considered collisions or errors and are dropped.' },
  { type: 'tf', q: 'A Layer 2 switch makes forwarding decisions based on IP addresses.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. Layer 2 switches use MAC addresses. Layer 3 devices (routers) use IP addresses.' },
  { type: 'short', q: 'What is the command to view the MAC address table on a Cisco switch?', ans: ['show mac address-table', 'show mac address table'], exp: 'The command is "show mac address-table".' },
  { type: 'mcq', q: 'Which device creates separate collision domains for every port?', options: {A: 'Hub', B: 'Switch', C: 'Repeater', D: 'Modem'}, ans: 'B', exp: 'Hubs have 1 collision domain for all ports. Switches create a separate collision domain for EACH port.' },

  // --- SET 5: SRWE Module 3 (VLANs) ---
  { type: 'mcq', q: 'Which VLAN carries untagged traffic on an 802.1Q trunk link?', options: {A: 'Data VLAN', B: 'Voice VLAN', C: 'Native VLAN', D: 'Management VLAN'}, ans: 'C', exp: 'The Native VLAN is the only VLAN that sends untagged frames across a trunk link.' },
  { type: 'mcq', q: 'What is the default Native VLAN on a Cisco switch?', options: {A: 'VLAN 0', B: 'VLAN 1', C: 'VLAN 10', D: 'VLAN 99'}, ans: 'B', exp: 'By default, the Native VLAN is VLAN 1. (Best practice is to change it for security).' },
  { type: 'tf', q: 'An access port can carry traffic for multiple VLANs simultaneously.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. Access ports belong to only one VLAN. Trunk ports carry multiple VLANs.' },
  { type: 'mcq', q: 'What type of port connects a switch to a router for inter-VLAN routing?', options: {A: 'Access port', B: 'Trunk port', C: 'Console port', D: 'Loopback port'}, ans: 'B', exp: 'The link between the switch and the router must be a trunk port so it can carry traffic for multiple VLANs.' },
  { type: 'short', q: 'What is the protocol used for VLAN tagging on Ethernet frames?', ans: ['802.1q', '802.1Q', 'dot1q'], exp: 'The IEEE 802.1Q standard is used for VLAN tagging.' },
  { type: 'mcq', q: 'Which VLAN type is used to remotely manage network devices (SSH/Telnet)?', options: {A: 'Voice VLAN', B: 'Data VLAN', C: 'Management VLAN', D: 'Native VLAN'}, ans: 'C', exp: 'The Management VLAN is specifically configured to handle administrative traffic like SSH, Telnet, and SNMP.' },
  { type: 'tf', q: 'If two switches are connected via a trunk link, they must both be configured with the same Native VLAN to avoid a mismatch error.', options: {A: 'True', B: 'False'}, ans: 'A', exp: 'True. A Native VLAN mismatch will cause spanning-tree issues and traffic will fail to pass correctly.' },
  { type: 'mcq', q: 'Which command configures a switch port as a trunk?', options: {A: 'switchport mode access', B: 'switchport mode trunk', C: 'switchport trunk native', D: 'vlan trunk enable'}, ans: 'B', exp: 'The command "switchport mode trunk" configures the port as a trunk.' },
  { type: 'mcq', q: 'What is the purpose of a Voice VLAN?', options: {A: 'To carry regular web traffic', B: 'To prioritize VoIP traffic using QoS', C: 'To manage the switch', D: 'To carry untagged traffic'}, ans: 'B', exp: 'Voice VLANs isolate VoIP traffic and apply QoS (Quality of Service) to ensure clear calls with no delay.' },
  { type: 'short', q: 'What command shows you the VLANs configured on a switch?', ans: ['show vlan brief', 'show vlan'], exp: 'The command "show vlan brief" displays all VLANs and their assigned ports.' },

  // --- SET 6: SRWE Module 4 (Inter-VLAN Routing) + ITN Transport Layer ---
  { type: 'mcq', q: 'Which inter-VLAN routing method requires multiple physical router interfaces?', options: {A: 'Legacy routing', B: 'Router-on-a-stick', C: 'Layer 3 switch', D: 'SVI routing'}, ans: 'A', exp: 'Legacy inter-VLAN routing uses a separate physical router interface for each VLAN.' },
  { type: 'mcq', q: 'What is a major disadvantage of Router-on-a-Stick?', options: {A: 'It is too expensive', B: 'It requires a Layer 3 switch', C: 'It creates a bottleneck on the single physical link', D: 'It cannot carry VLAN tags'}, ans: 'C', exp: 'Because all VLAN traffic travels over one single cable to the router, it can become a bottleneck (not scalable).' },
  { type: 'tf', q: 'A Layer 3 switch uses SVIs (Switch Virtual Interfaces) to route traffic at hardware speeds.', options: {A: 'True', B: 'False'}, ans: 'A', exp: 'True. Layer 3 switches use SVIs and ASICs to route traffic internally at wire speed, which is much faster than a router.' },
  { type: 'short', q: 'What process does TCP use to establish a connection before sending data?', ans: ['three-way handshake', '3-way handshake', 'three way handshake'], exp: 'TCP uses the SYN, SYN-ACK, ACK 3-way handshake to establish a reliable connection.' },
  { type: 'mcq', q: 'Which protocol is connectionless, unreliable, and has an 8-byte header?', options: {A: 'TCP', B: 'UDP', C: 'IP', D: 'ICMP'}, ans: 'B', exp: 'UDP is connectionless, best-effort (unreliable), and has a minimal 8-byte header.' },
  { type: 'mcq', q: 'Which TCP mechanism prevents the receiver from being overwhelmed by too much data?', options: {A: 'Checksum', B: 'Flow control (window size)', C: 'Sequence numbers', D: 'Port numbers'}, ans: 'B', exp: 'Flow control uses the "window size" field to tell the sender how much data the receiver can handle at once.' },
  { type: 'mcq', q: 'If a network has 10 hosts and 6 hosts, which two subnets should be used?', options: {A: '/28 and /29', B: '/27 and /28', C: '/29 and /30', D: '/26 and /27'}, ans: 'A', exp: '/28 gives 14 usable (fits 10). /29 gives 6 usable (fits 6).' },
  { type: 'tf', q: 'HTTP is a stateless protocol, meaning it does not remember previous requests.', options: {A: 'True', B: 'False'}, ans: 'A', exp: 'True. HTTP is stateless. Cookies and sessions are used to add state.' },
  { type: 'mcq', q: 'Which email protocol keeps emails synchronized across multiple devices (phone and laptop)?', options: {A: 'POP3', B: 'IMAP', C: 'SMTP', D: 'FTP'}, ans: 'B', exp: 'IMAP keeps the email on the server so all devices see the same inbox. POP3 downloads and deletes from the server.' },
  { type: 'short', q: 'What is the command to configure a router subinterface for VLAN 10?', ans: ['interface g0/0/1.10', 'int g0/0/1.10', 'interface gi0/0/1.10'], exp: 'You create a subinterface by adding the VLAN ID to the physical interface (e.g., interface g0/0/1.10).' }
];

/* ============================================================
   APPLICATION LOGIC
   ============================================================ */
let currentSet = 0;
let score = 0;
let answeredCount = 0;
const totalSets = allQuestions.length / 10;
const questionsPerSet = 10;

function renderSet() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  
  const startIdx = currentSet * questionsPerSet;
  const endIdx = startIdx + questionsPerSet;
  const setQuestions = allQuestions.slice(startIdx, endIdx);

  setQuestions.forEach((q, index) => {
    const globalIndex = startIdx + index + 1;
    const div = document.createElement('div');
    div.className = 'question';
    div.id = `q-${startIdx + index}`;
    
    let inputHTML = '';
    if (q.type === 'mcq' || q.type === 'tf') {
      inputHTML = '<div class="options">';
      Object.entries(q.options).forEach(([key, val]) => {
        inputHTML += `<label><input type="radio" name="q_${startIdx + index}" value="${key}"> <span><strong>${key})</strong> ${val}</span></label>`;
      });
      inputHTML += '</div>';
    } else if (q.type === 'short') {
      inputHTML = `<div class="short-answer"><input type="text" id="short-${startIdx + index}" placeholder="Type your answer here..."></div>`;
    }

    div.innerHTML = `
      <div class="q-text">${globalIndex}. ${q.q}</div>
      ${inputHTML}
      <div class="feedback" id="fb-${startIdx + index}"></div>
    `;
    container.appendChild(div);
  });

  // Add highlight effect for selections
  document.querySelectorAll('.options input').forEach(inp => {
    inp.addEventListener('change', function() {
      document.querySelectorAll(`input[name="${this.name}"]`).forEach(other => {
        other.closest('label').classList.toggle('selected', other.checked);
      });
    });
  });

  // Update UI
  document.getElementById('pageDisplay').textContent = currentSet + 1;
  document.getElementById('progressText').textContent = `Progress: ${startIdx} / ${allQuestions.length}`;
  
  // Buttons
  document.getElementById('submitBtn').style.display = 'block';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('submitBtn').disabled = false;
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitSet() {
  const startIdx = currentSet * questionsPerSet;
  const endIdx = startIdx + questionsPerSet;
  const setQuestions = allQuestions.slice(startIdx, endIdx);
  let setScore = 0;

  setQuestions.forEach((q, index) => {
    const qIndex = startIdx + index;
    const fb = document.getElementById(`fb-${qIndex}`);
    let isCorrect = false;
    let userAnswer = '';
    let correctAnswerText = '';

    if (q.type === 'mcq' || q.type === 'tf') {
      const sel = document.querySelector(`input[name="q_${qIndex}"]:checked`);
      if (sel) {
        userAnswer = sel.value;
        if (userAnswer === q.ans) isCorrect = true;
      }
      correctAnswerText = `${q.ans}) ${q.options[q.ans]}`;
    } else if (q.type === 'short') {
      const inp = document.getElementById(`short-${qIndex}`);
      userAnswer = inp.value.trim().toLowerCase().replace(/\s+/g, ' ');
      if (q.ans.some(a => a.toLowerCase() === userAnswer)) isCorrect = true;
      correctAnswerText = q.ans[0].toUpperCase();
    }

    if (isCorrect) {
      setScore++;
      fb.className = 'feedback correct';
      fb.innerHTML = `<strong>✅ Correct!</strong> ${q.exp}`;
    } else {
      fb.className = 'feedback incorrect';
      fb.innerHTML = `<span class="answer">❌ Incorrect. Correct Answer: ${correctAnswerText}</span> ${q.exp}`;
    }
  });

  score += setScore;
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('submitBtn').style.display = 'none';
  
  // Show Modal
  const modal = document.getElementById('resultModal');
  const modalScore = document.getElementById('modalScore');
  const modalTitle = document.getElementById('modalTitle');
  const modalMsg = document.getElementById('modalMessage');
  const modalBtn = modal.querySelector('.btn-next');

  modalScore.textContent = `${setScore} / 10`;
  
  if (currentSet === totalSets - 1) {
    modalTitle.textContent = '🎉 Final Exam Prep Complete!';
    modalScore.textContent = `${score} / ${allQuestions.length}`;
    modalMsg.textContent = 'You have completed all 60 questions. Review the feedback above!';
    modalBtn.textContent = 'Restart Quiz';
    modalBtn.onclick = () => location.reload();
  } else {
    modalTitle.textContent = `Set ${currentSet + 1} Complete!`;
    modalMsg.textContent = setScore >= 7 ? 'Great job! Keep it up.' : 'Review the explanations below and try to improve on the next set.';
    modalBtn.textContent = 'Continue to Next Set';
    modalBtn.onclick = closeModalAndNext;
  }

  modal.classList.add('show');
}

function closeModalAndNext() {
  document.getElementById('resultModal').classList.remove('show');
  currentSet++;
  renderSet();
}

// Initialize
renderSet();
</script>
